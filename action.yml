name: OSS Link Auditor
description: Audit broken and redirected links in Markdown with safe TLS defaults
author: Aryalmilan-max

branding:
  icon: link
  color: blue

inputs:
  paths:
    description: Newline-separated Markdown files or directories to audit
    required: false
    default: "."
  fail-on-broken:
    description: Return a failing status when broken or unreachable links are found
    required: false
    default: "true"
  workers:
    description: Maximum concurrent link checks
    required: false
    default: "12"
  timeout:
    description: Per-request timeout in seconds
    required: false
    default: "15"
  allow-private:
    description: Allow private or loopback targets; only for trusted internal documentation
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Audit Markdown links
      shell: bash
      env:
        AUDIT_PATHS: ${{ inputs.paths }}
        AUDIT_FAIL: ${{ inputs.fail-on-broken }}
        AUDIT_WORKERS: ${{ inputs.workers }}
        AUDIT_TIMEOUT: ${{ inputs.timeout }}
        AUDIT_ALLOW_PRIVATE: ${{ inputs.allow-private }}
      run: |
        paths=()
        while IFS= read -r path; do
          if [[ -n "$path" ]]; then
            paths+=("$path")
          fi
        done <<< "$AUDIT_PATHS"
        args=("${paths[@]}" --workers "$AUDIT_WORKERS" --timeout "$AUDIT_TIMEOUT")
        if [[ "$AUDIT_FAIL" == "true" ]]; then
          args+=(--fail-on-broken)
        fi
        if [[ "$AUDIT_ALLOW_PRIVATE" == "true" ]]; then
          args+=(--allow-private)
        fi
        set +e
        PYTHONPATH="$GITHUB_ACTION_PATH/src" python -m oss_link_auditor.cli "${args[@]}" --markdown \
          | tee oss-link-auditor-report.md
        status=${PIPESTATUS[0]}
        cat oss-link-auditor-report.md >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
