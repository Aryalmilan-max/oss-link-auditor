name: Documentation improvement
description: Report unclear, missing, or incorrect documentation
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Page or section
      placeholder: README Quick start
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: A concrete example is welcome but not required.
