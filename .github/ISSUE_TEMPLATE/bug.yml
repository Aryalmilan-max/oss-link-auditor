name: Bug report
description: Report incorrect parsing, checking, or output behavior
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command, observed output, and expected result.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.7"
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal Markdown example
      description: Remove secrets and private URLs before posting.
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, and private URLs from this report.
          required: true
